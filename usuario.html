<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8">
  <title>CRUD Usuario</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <nav>
    <a href="index.html">Inicio</a> |
    <a href="usuario.html">Usuario</a> |
    <a href="estudante.html">Estudante</a> |
    <a href="mentora.html">Mentora</a> |
    <a href="mentoria.html">Mentoria</a> |
    <a href="evento.html">Evento</a>
  </nav>

  <h1>Cadastro de Usuario</h1>
  <form id="form" class="cadastro-usuario-tabela" onsubmit="salvar(); return false;">
    <label>ID Usuario:</label>
    <input type="text" id="id_usuario" required><br><br>

    <label>Login:</label>
    <input type="text" id="login" required><br><br>

    <label>Nome:</label>
    <input type="text" id="nome" required><br><br>

    <label>Telefone:</label>
    <input type="text" id="telefone"><br><br>

    <label>Email:</label>
    <input type="email" id="email"><br><br>

    <button type="submit">Salvar</button>
  </form>

  <h2>Lista de Usuarios</h2>
  <table border="1" cellpadding="5">
    <tr>
      <th>ID</th>
      <th>Login</th>
      <th>Nome</th>
      <th>Telefone</th>
      <th>Email</th>
      <th>Editar</th>
    </tr>
    <tbody id="tabela"></tbody>
  </table>

  <script src="usuario.js"></script>
</body>
</html>
