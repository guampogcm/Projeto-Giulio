<h1>Cadastro de Mentora</h1>

<form id="form" class="cadastro-mentora-tabela" onsubmit="salvar(); return false;">
  <label>ID Mentora:</label>
  <input type="text" id="id_mentora" required><br><br>

  <label>Disponibilidade:</label>
  <input type="text" id="disponibilidade"><br><br>

  <label>Area de Atuacao:</label>
  <input type="text" id="area_atuacao"><br><br>

  <label>Empresa:</label>
  <input type="text" id="empresa"><br><br>

  <button type="submit">Salvar</button>
</form>

<h2>Lista de Mentoras</h2>
<table border="1" cellpadding="5">
  <tr>
    <th>ID</th>
    <th>Disponibilidade</th>
    <th>Area Atuacao</th>
    <th>Empresa</th>
    <th>Editar</th>
  </tr>
  <tbody id="tabela"></tbody>
</table>

<script src="mentora.js"></script>
</body>
